// media3 의 lib-decoder-ffmpeg 모듈을 그대로 가져온 것 (androidx/media 1.3.1 태그).
//
// 왜 소스를 들고 오나: androidx.media3:media3-decoder-ffmpeg 는 Maven 에 배포되지 않는다.
// 공식 컴포넌트지만 NDK 로 직접 빌드해야 해서, FFmpeg 정적 라이브러리를 만든 뒤
// 이 모듈이 그것을 감싸 libffmpegJNI.so 를 낸다. 빌드 방법은 README.md 참고.
//
// 패키지명(androidx.media3.decoder.ffmpeg)은 바꾸면 안 된다 —
// ffmpeg_jni.cc 의 JNI 심볼 이름이 이 패키지에 묶여 있다.
plugins { id 'com.android.library' }

android {
    namespace 'androidx.media3.decoder.ffmpeg'
    compileSdk 34

    defaultConfig {
        minSdk 21
        ndk { abiFilters 'arm64-v8a' }   // 앱과 동일. 기기가 arm64 하나뿐이다
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.31.6'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.media3:media3-decoder:1.3.1'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.annotation:annotation:1.7.1'
    // media3 소스가 쓰는 널 검사 애너테이션. 런타임에는 필요 없다.
    compileOnly 'org.checkerframework:checker-qual:3.42.0'
}
