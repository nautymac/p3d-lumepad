plugins { id 'com.android.application' }

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.nauty.p3d'
    compileSdk 34

    defaultConfig {
        applicationId "com.nauty.p3d"
        minSdk 21
        targetSdk 28          // 기기가 API 26 — 레거시 저장소 접근 유지
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }   // 기기가 arm64. libVLC 가 ABI 당 ~30MB 라 하나만 담는다
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // smbj 가 java.time 을 쓴다. minSdk 21 이라 데스슈가링이 있어야 링크된다.
        coreLibraryDesugaringEnabled true
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    signingConfigs {
        release {
            // keystore.properties 와 .jks 는 저장소에 넣지 않는다 (.gitignore 처리)
            if (keystoreProps["storeFile"] != null) {
                storeFile     file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias      keystoreProps["keyAlias"]
                keyPassword   keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            if (keystoreProps["storeFile"] != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation project(':ffmpeg')          // AC3/E-AC3/DTS/TrueHD 소프트웨어 디코딩

    // SMB 재생 (HANDOFF 1-②). Apache-2.0 — 이 저장소의 MIT 와 함께 배포해도 된다.
    // jcifs-ng 는 LGPL 이라 배포 조건이 달라 피했다.
    implementation 'com.hierynomus:smbj:0.13.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Leia CNSDK — 기기의 com.moonlight.leia APK 에서 꺼낸다. 재배포할 수 없어서
    // 저장소에 넣지 않았다. 꺼내는 방법은 LUMEPAD2-PORT.md 참고.
    // 같은 이유로 app/src/main/jniLibs/ 의 libleiaSDK.so, libleiaspdlog.so 와
    // app/src/main/assets/shaders/ 도 저장소에 없다.
    implementation files('libs/leia-cnsdk.jar')
}
