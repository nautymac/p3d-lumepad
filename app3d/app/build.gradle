plugins { id 'com.android.application' }

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.nauty.p3d'
    compileSdk 34

    defaultConfig {
        applicationId "com.nauty.p3d"
        minSdk 21
        targetSdk 28          // 기기가 API 26 — 레거시 저장소 접근 유지
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }   // 기기가 arm64. libVLC 가 ABI 당 ~30MB 라 하나만 담는다
    }

    // 패널이 다르면 마지막 렌더 단계가 통째로 달라진다.
    //   proma : libholography 마스크로 우리가 직접 인터레이스 (렌티큘러, 고정 패턴)
    //   leia  : Leia CNSDK 가 위빙 (8방향 회절 + 얼굴추적이라 정적 패턴이 불가능)
    // CNSDK 는 기기에서 추출한 것이라 재배포할 수 없다. proma 빌드에는 들어가지 않게
    // 소스셋을 갈라 둔다 (app/src/leia/ 아래 jniLibs 와 매니페스트).
    flavorDimensions += "panel"
    productFlavors {
        proma { dimension "panel" }
        leia  { dimension "panel" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    signingConfigs {
        release {
            // keystore.properties 와 .jks 는 저장소에 넣지 않는다 (.gitignore 처리)
            if (keystoreProps["storeFile"] != null) {
                storeFile     file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias      keystoreProps["keyAlias"]
                keyPassword   keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            if (keystoreProps["storeFile"] != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'org.videolan.android:libvlc-all:3.6.0'
    implementation project(':ffmpeg')          // AC3/E-AC3/DTS/TrueHD 소프트웨어 디코딩

    // Leia CNSDK — com.moonlight.leia APK 에서 추출. 저장소에 없다 (LUMEPAD2-PORT.md 참고)
    leiaImplementation files('libs/leia-cnsdk.jar')
}
